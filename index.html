<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tô no Trabalho - Cardápio</title>
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Seu CSS na pasta styles -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-briefcase"></i> Tô no Trabalho</h1>
        <p>A desculpa perfeita para quando te ligarem cobrando!</p>
    </header>

    <!-- Onde a mágica acontece (Injeção dos produtos) -->
    <div id="cardapio-container"></div>

    <!-- Barra do Carrinho Fixa -->
    <div class="cart-bar">
        <div class="cart-info">
            <div class="cart-icon-wrapper">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
            <div>
                <div class="cart-label">Total selecionado:</div>
                <div id="cart-total" class="cart-total-value">R$ 0,00</div>
            </div>
        </div>
        <a href="#" id="whatsapp-link" target="_blank" class="checkout-btn" onclick="return processCheckout(event)">
            <i class="fa-brands fa-whatsapp"></i> Fechar Pedido no Whats
        </a>
    </div>

    <!-- Seus Scripts (Primeiro o menu com preços, depois a lógica do carrinho) -->
    <script src="scripts/menu.js"></script>
    <script src="scripts/cart.js"></script>
</body>
</html>
